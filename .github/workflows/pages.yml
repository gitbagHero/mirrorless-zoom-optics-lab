name: Publish lens lab to GitHub Pages

on:
  push:
    branches: [gpt-optics-demo]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'gitbagHero/mirrorless-zoom-optics-lab-gpt' && github.ref == 'refs/heads/gpt-optics-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Verify optical model
        run: pnpm test
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build for the published path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$PAGES_BASE_URL"
          if [ "${PAGES_BASE_URL%/}" = "https://gitbaghero.github.io/mirrorless-zoom-optics-lab" ]; then
            echo "::error::The existing project Pages URL is reserved."
            exit 1
          fi
          pnpm run build --base "${PAGES_BASE_PATH%/}/"
      - name: Upload the site build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    if: github.repository == 'gitbagHero/mirrorless-zoom-optics-lab-gpt' && github.ref == 'refs/heads/gpt-optics-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      site_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - name: Install browser test dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify the deployed site
        env:
          PLAYWRIGHT_SITE_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          test -n "$PLAYWRIGHT_SITE_URL"
          pnpm test:browser
